[package]
name = "wincred-libsecret-provider"
description = "Freedesktop Secret Service provider for WSL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "wincred-libsecret-provider"
path = "src/main.rs"

[dependencies]
aes = "0.9.2"
async-trait = "0.1.89"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
clap.workspace = true
futures-util = "0.3.31"
num-bigint = { version = "0.4.6", features = ["rand"] }
num-traits = "0.2.19"
rand = "0.10.2"
rand_08 = { package = "rand", version = "0.8.5" }
sha2 = "0.11.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
wincred-libsecret-protocol = { path = "../protocol" }
zeroize.workspace = true
zbus.workspace = true

[lints]
workspace = true
