[workspace]
members = [
    "crates/broker",
    "crates/cli",
    "crates/protocol",
    "crates/provider",
    "crates/test-support",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.23.0"
bytes = "1.10.1"
ciborium = "0.2.2"
clap = { version = "4.5.51", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
semver = "1.0.27"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
zeroize = { version = "1.8.2", features = ["derive"] }
zbus = { version = "5.12.0", default-features = false, features = ["tokio"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_lifetimes = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
