[changelog]
header = """
# Changelog

All notable changes to this project are documented here. This file is generated
from [Conventional Commits](https://www.conventionalcommits.org) by
[git-cliff](https://git-cliff.org).
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}]\
    {% if previous.version %} ([compare]($REPO_URL/compare/{{ previous.version }}...{{ version }})){% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[breaking] {% endif %}\
            {{ commit.message | upper_first }} \
            ([{{ commit.id | truncate(length=7, end="") }}]($REPO_URL/commit/{{ commit.id }}))
    {% endfor %}
{% endfor %}\n
{% endif %}\
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
postprocessors = [
  { pattern = '\$REPO_URL', replace = "https://github.com/bmiddha/wincred-libsecret-wsl-plugin" },
]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
tag_pattern = "^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/bmiddha/wincred-libsecret-wsl-plugin/issues/${2}))" },
]
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^Merge pull request", skip = true },
  { message = "^Merge branch", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^ci|^build", group = "<!-- 6 -->CI and build" },
  { message = "^style", group = "<!-- 7 -->Style" },
  { body = ".*security", group = "<!-- 8 -->Security" },
  { message = "^chore|^revert", group = "<!-- 9 -->Maintenance" },
  { message = ".*", group = "<!-- 10 -->Other changes" },
]
topo_order = false
sort_commits = "oldest"

[git.remote.github]
owner = "bmiddha"
repo = "wincred-libsecret-wsl-plugin"
