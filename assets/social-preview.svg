<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">WinCred Libsecret WSL Plugin</title>
  <desc id="description">GitHub social preview featuring the Lavender Blush Dual-Key Guardian logo, with a chain linking WinCred and libsecret.</desc>
  <defs>
    <linearGradient id="cardBackground" x1="40" y1="0" x2="1240" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21182D"/>
      <stop offset="0.58" stop-color="#30203D"/>
      <stop offset="1" stop-color="#3D294C"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="0" cy="0" r="1" gradientTransform="translate(260 320) rotate(90) scale(330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B99AE8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#B99AE8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoBackground" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F1EAFB"/>
      <stop offset="1" stop-color="#D8C9EE"/>
    </linearGradient>
    <linearGradient id="logoBody" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#C5AAEF"/>
      <stop offset="1" stop-color="#9B7DD0"/>
    </linearGradient>
    <linearGradient id="logoBelly" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFBFF"/>
      <stop offset="1" stop-color="#EFE5F8"/>
    </linearGradient>
    <linearGradient id="logoWarm" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F7D584"/>
      <stop offset="1" stop-color="#E8A95B"/>
    </linearGradient>
    <linearGradient id="logoKey" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F0ACC9"/>
      <stop offset="0.5" stop-color="#DF7FB2"/>
      <stop offset="1" stop-color="#C65C9A"/>
    </linearGradient>
    <clipPath id="logoCanvas">
      <rect width="256" height="256" rx="56"/>
    </clipPath>
    <filter id="logoShadow" x="-25%" y="-25%" width="150%" height="165%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0D0912" flood-opacity="0.4"/>
    </filter>
    <g id="logoKeyShape">
      <path d="M0-18A18 18 0 1 1 0 18A18 18 0 1 1 0-18ZM0-7A7 7 0 1 0 0 7A7 7 0 1 0 0-7Z" fill="url(#logoKey)" fill-rule="evenodd"/>
      <path d="M14-7H54V7H44V18H34V7H26V16H18V7H14V-7Z" fill="url(#logoKey)"/>
    </g>
    <symbol id="brandMark" viewBox="0 0 256 256">
      <rect width="256" height="256" rx="56" fill="url(#logoBackground)"/>
      <rect x="1" y="1" width="254" height="254" rx="55" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
      <g clip-path="url(#logoCanvas)">
        <path d="M128 30C170 30 215 65 225 150C230 190 225 260 225 260H31S26 190 31 150C41 65 86 30 128 30Z" fill="url(#logoBody)"/>
        <path d="M128 65C150 40 190 60 190 110C190 160 160 260 128 260C96 260 66 160 66 110C66 60 106 40 128 65Z" fill="url(#logoBelly)"/>
        <use href="#logoKeyShape" transform="translate(56 115) scale(-1 1) rotate(-80)"/>
        <use href="#logoKeyShape" transform="translate(200 115) rotate(-80)"/>
        <path d="M31 260C11 180 21 130 46 115C61 105 71 125 61 135C56 140 46 170 51 260H31Z" fill="url(#logoBody)"/>
        <path d="M225 260C245 180 235 130 210 115C195 105 185 125 195 135C200 140 210 170 205 260H225Z" fill="url(#logoBody)"/>
        <g fill="#47345E">
          <circle cx="95" cy="95" r="10"/>
          <circle cx="161" cy="95" r="10"/>
        </g>
        <g fill="#FFFFFF">
          <circle cx="91" cy="91" r="3"/>
          <circle cx="157" cy="91" r="3"/>
        </g>
        <path d="M108 115H148L128 140Z" fill="url(#logoWarm)"/>
        <path d="M116 118H140L128 134Z" fill="#FFF1B8" opacity="0.4"/>
        <path d="M128 175C135 175 140 180 140 187C140 191 138 195 135 197L139 215H117L121 197C118 195 116 191 116 187C116 180 121 175 128 175Z" fill="#47345E" stroke="#E69ABF" stroke-width="1.5" stroke-linejoin="round"/>
      </g>
    </symbol>
  </defs>

  <rect width="1280" height="640" fill="url(#cardBackground)"/>
  <rect width="1280" height="640" fill="url(#cardGlow)"/>
  <path d="M1012-80A390 390 0 0 1 1360 268" fill="none" stroke="#B99AE8" stroke-opacity="0.08" stroke-width="52"/>
  <path d="M1080-52A302 302 0 0 1 1332 200" fill="none" stroke="#E69ABF" stroke-opacity="0.08" stroke-width="18"/>
  <circle cx="1180" cy="552" r="134" fill="none" stroke="#F4C56F" stroke-opacity="0.07" stroke-width="34"/>

  <use href="#brandMark" x="96" y="160" width="320" height="320" filter="url(#logoShadow)"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="464" y="310" fill="#FAF5FF" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="70" font-weight="700" letter-spacing="-2">WinCred</text>
    <g transform="translate(783 258) scale(2.2)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2">
      <path d="M10 13A5 5 0 0 0 17.54 13.54L20.54 10.54A5 5 0 0 0 13.47 3.47L11.75 5.18" stroke="#E69ABF"/>
      <path d="M14 11A5 5 0 0 0 6.46 10.46L3.46 13.46A5 5 0 0 0 10.53 20.53L12.24 18.82" stroke="#B99AE8"/>
    </g>
    <text x="850" y="310" fill="#E69ABF" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="70" font-weight="700" letter-spacing="-2">libsecret</text>
    <text x="464" y="374" fill="#E7D9F2" font-size="30" font-weight="400">WSL secrets backed by Windows Credential Manager.</text>
  </g>
</svg>
