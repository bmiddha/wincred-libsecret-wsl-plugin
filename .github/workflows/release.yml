name: Release preparation

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump when version is not supplied
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: Explicit MAJOR.MINOR.PATCH version, optionally prefixed with v
        type: string
        required: false
        default: ""
      prerelease:
        description: Mark the eventual GitHub Release as a prerelease
        type: boolean
        default: false
      initial_release:
        description: Bootstrap the first release from the current workspace version
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-preparation-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  prepare:
    name: Prepare release pull request
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Mint release automation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version | grep -F '1.97.1'
      - name: Restore Cargo dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-preparation-ubuntu-24.04-rust-1.97.1
          cache-bin: "false"
          cache-targets: "false"
      - name: Install pinned git-cliff
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: git-cliff@2.9.1
      - name: Compute release version
        id: version
        shell: bash
        env:
          REQUESTED_BUMP: ${{ inputs.bump }}
          REQUESTED_VERSION: ${{ inputs.version }}
          INITIAL_RELEASE: ${{ inputs.initial_release }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          current="$(
            awk '
              /^\[workspace\.package\]$/ { inside = 1; next }
              /^\[/ { inside = 0 }
              inside && /^version[[:space:]]*=/ {
                value = $0
                sub(/^[^"]*"/, "", value)
                sub(/".*$/, "", value)
                print value
                exit
              }
            ' Cargo.toml
          )"
          if [[ ! "$current" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Cargo.toml does not contain a three-part [workspace.package] version."
            exit 1
          fi

          initial_release="${INITIAL_RELEASE:-false}"
          if [[ "$initial_release" != "true" && "$initial_release" != "false" ]]; then
            echo "::error::initial_release must be true or false."
            exit 1
          fi
          requested="${REQUESTED_VERSION:-}"
          requested="${requested#v}"
          if [[ "$initial_release" == "true" ]]; then
            if [[ -n "$requested" && "$requested" != "$current" ]]; then
              echo "::error::The initial release must use the current workspace version '$current'."
              exit 1
            fi
            if git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -q .; then
              echo "::error::An initial release is only allowed when no SemVer release tag exists."
              exit 1
            fi
            next="$current"
          else
            IFS=. read -r major minor patch <<<"$current"
            if [[ -n "$requested" ]]; then
              next="$requested"
            else
              bump="${REQUESTED_BUMP:-auto}"
              if [[ "$bump" == "auto" ]]; then
                last_tag="$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
                range="HEAD"
                if [[ -n "$last_tag" ]]; then
                  range="$last_tag..HEAD"
                fi
                messages="$(git log --format='%s%n%b' "$range")"
                if grep -Eiq '(^|[[:space:]])BREAKING[ -]CHANGE:|^[[:alnum:]]+(\([^)]+\))?!:' <<<"$messages"; then
                  bump="major"
                elif git log --format='%s' "$range" | grep -Eq '^feat(\([^)]+\))?:'; then
                  bump="minor"
                else
                  bump="patch"
                fi
              fi

              case "$bump" in
                major) next="$((major + 1)).0.0" ;;
                minor) next="$major.$((minor + 1)).0" ;;
                patch) next="$major.$minor.$((patch + 1))" ;;
                *)
                  echo "::error::Unsupported version bump '$bump'."
                  exit 1
                  ;;
              esac
            fi
          fi

          if [[ ! "$next" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release version '$next' must use MAJOR.MINOR.PATCH."
            exit 1
          fi
          if [[ "$initial_release" != "true" ]]; then
            IFS=. read -r next_major next_minor next_patch <<<"$next"
            if (( next_major < major ||
                  (next_major == major && next_minor < minor) ||
                  (next_major == major && next_minor == minor && next_patch <= patch) )); then
              echo "::error::Release version '$next' must be greater than the current version '$current'."
              exit 1
            fi
          fi
          tag="v$next"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag '$tag' already exists."
            exit 1
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "initial_release=$initial_release" >> "$GITHUB_OUTPUT"
      - name: Update release manifest, lockfile, and changelog
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          INITIAL_RELEASE: ${{ steps.version.outputs.initial_release }}
        run: |
          set -euo pipefail
          update_workspace_version() {
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Cargo.toml")
          content = path.read_text(encoding="utf-8")
          section = re.search(
              r"(?ms)^\[workspace\.package\]\r?\n(?P<body>.*?)(?=^\[|\Z)",
              content,
          )
          if section is None:
              raise SystemExit("Cargo.toml is missing [workspace.package].")
          version = re.search(
              r'(?m)^version\s*=\s*"(?P<version>\d+\.\d+\.\d+)"\s*$',
              section.group("body"),
          )
          if version is None:
              raise SystemExit(
                  "Cargo.toml is missing a three-part [workspace.package] version."
              )
          start = section.start("body") + version.start("version")
          end = section.start("body") + version.end("version")
          path.write_text(
              content[:start] + os.environ["VERSION"] + content[end:],
              encoding="utf-8",
          )
          PY
          }
          if [[ "$INITIAL_RELEASE" != "true" ]]; then
            update_workspace_version
            cargo update --workspace
            if git diff --quiet -- Cargo.lock; then
              echo "::error::Updating the workspace version did not refresh Cargo.lock."
              exit 1
            fi
            cargo metadata --locked --format-version 1 --no-deps >/dev/null
          elif ! git diff --quiet -- Cargo.toml Cargo.lock; then
            echo "::error::The initial release must not change Cargo.toml or Cargo.lock."
            exit 1
          fi
          git cliff --config .config/cliff.toml --tag "$TAG" -o CHANGELOG.md
          notes_path="${RUNNER_TEMP}/release-notes.md"
          git cliff --config .config/cliff.toml --tag "$TAG" --latest --strip all -o "$notes_path"
          if [[ ! -s CHANGELOG.md || ! -s "$notes_path" ]]; then
            echo "::error::git-cliff did not generate release changelog output."
            exit 1
          fi
          git add -N CHANGELOG.md
          git diff --check
      - name: Open release pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          INITIAL_RELEASE: ${{ steps.version.outputs.initial_release }}
        run: |
          set -euo pipefail
          branch="release/$TAG"
          if gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty' | grep -q .; then
            echo "::error::An open release pull request already exists for '$TAG'."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            echo "::error::Release branch '$branch' already exists. Close and delete the stale branch before retrying."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          if git diff --cached --quiet; then
            echo "::error::Release preparation did not change its expected release files."
            exit 1
          fi
          git commit -m "chore(release): $TAG"
          git push origin "$branch"

          gh label create release --color 0e8a16 --description "Release preparation pull request" 2>/dev/null || true
          labels=(--label release)
          if [[ "$INITIAL_RELEASE" == "true" ]]; then
            gh label create initial-release --color 1d76db --description "Initial release bootstrap" 2>/dev/null || true
            labels+=(--label initial-release)
          fi
          if [[ "${PRERELEASE:-false}" == "true" ]]; then
            gh label create prerelease --color fbca04 --description "Prerelease publication" 2>/dev/null || true
            labels+=(--label prerelease)
          fi
          cat > release-pr.md <<EOF
          Automated release preparation for **$TAG**.

          Merge this pull request only after reviewing the version bump and its
          normal CI results. The publish workflow will then wait for the merge
          commit's CI run, run the hosted WSL end-to-end suite, sign the release
          from those CI build inputs, create the tag, and publish the GitHub Release.

          ---

          $(cat "$RUNNER_TEMP/release-notes.md")
          EOF
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "chore(release): $TAG" \
            --body-file release-pr.md \
            "${labels[@]}"
