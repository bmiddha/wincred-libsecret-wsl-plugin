name: Release preparation

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump when version is not supplied
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: Explicit MAJOR.MINOR.PATCH version, optionally prefixed with v
        type: string
        required: false
        default: ""
      prerelease:
        description: Mark the eventual GitHub Release as a prerelease
        type: boolean
        default: false
      initial_release:
        description: Bootstrap the first release from the current workspace version
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-preparation-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  prepare:
    name: Prepare release pull request
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Mint release automation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version | grep -F '1.97.1'
      - name: Restore Cargo dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-preparation-ubuntu-24.04-rust-1.97.1
          cache-bin: "false"
          cache-targets: "false"
      - name: Install pinned git-cliff
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: git-cliff@2.9.1
      - name: Compute release version
        id: version
        shell: bash
        env:
          REQUESTED_BUMP: ${{ inputs.bump }}
          REQUESTED_VERSION: ${{ inputs.version }}
          INITIAL_RELEASE: ${{ inputs.initial_release }}
        run: bash scripts/release/get-release-version.sh
      - name: Update release manifest, lockfile, and changelog
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          INITIAL_RELEASE: ${{ steps.version.outputs.initial_release }}
        run: bash scripts/release/update-release-manifest.sh
      - name: Open release pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          INITIAL_RELEASE: ${{ steps.version.outputs.initial_release }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/release/new-release-pull-request.sh
